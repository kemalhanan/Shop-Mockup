kind = "web"
previewPath = "/"
title = "Clothing Storefront"
description = "A polished clothing boutique storefront mockup with a browsable catalog, category filters, and an interactive shopping cart."
version = "1.0.0"
id = "artifacts/clothing-storefront"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20383

[services.development]
run = "pnpm --filter @workspace/clothing-storefront run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clothing-storefront", "run", "build" ]
serve = "static"
publicDir = "artifacts/clothing-storefront/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20383"
BASE_PATH = "/"
